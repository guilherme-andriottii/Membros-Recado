form.addEventListener("submit", async (event) => {
event.preventDefault();

const estavaEditando = !!membroEditando;

const membro = {
nome: document.getElementById("nome").value,
ano: Number(document.getElementById("ano").value),
cidade: document.getElementById("cidade").value,
ministerio: document.getElementById("ministerio").value,
etapa: document.getElementById("etapa").value,
casaMissao: document.getElementById("casaMissao").value
};

try {
let resposta;

if (estavaEditando) {
resposta = await fetch(`/membros/${membroEditando.id}`, {
method: "PUT",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify(membro)
});
} else {
resposta = await fetch("/membros", {
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify(membro)
});
}

if (!resposta.ok) {
throw new Error("Não foi possível salvar o membro.");
}

fecharModal();
await carregarMembros();

mostrarToast(
estavaEditando
? "Membro atualizado com sucesso."
: "Membro cadastrado com sucesso."
);

} catch (erro) {
console.error(erro);
mostrarToast("Ocorreu um erro ao salvar o membro.", "erro");
}
});