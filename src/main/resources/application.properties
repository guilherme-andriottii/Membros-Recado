# =====================================================================
#  application.properties = configurações do Spring Boot
#  Linhas com "#" são comentários. Formato:  chave=valor
# =====================================================================

# Nome da aplicação (aparece nos logs)
spring.application.name=controle-membros

# ---------- CONEXÃO COM O BANCO (PostgreSQL) ----------
# Endereço do banco: jdbc:postgresql://SERVIDOR:PORTA/NOME_DO_BANCO
# localhost = o próprio computador | 5432 = porta padrão do PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ComunidadeRecado
spring.datasource.username=postgres
# Senha em texto puro: ok para estudo/desenvolvimento local; em produção o
# ideal é ler de variável de ambiente.
spring.datasource.password=postgres
# Classe do driver que "fala" PostgreSQL (vem da dependência org.postgresql)
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JPA / HIBERNATE ----------
# Dialeto = o "sotaque" SQL do PostgreSQL (normalmente o Hibernate já
# descobre sozinho; mantido como estava).
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# "none" = o Hibernate NÃO cria nem altera tabelas. A tabela "membros" já
# existe no banco e é gerenciada por você (por isso, se o banco tiver uma
# regra limitando "ano" a 1 ou 2, ela precisa ser ajustada à mão: ver
# explicação da regra do ano 0).
spring.jpa.hibernate.ddl-auto=none
# Mostra no console cada SQL executado (útil para aprender/depurar)
spring.jpa.show-sql=true